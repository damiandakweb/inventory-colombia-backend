# ===============================================
# CONFIGURACIÓN GENERAL - PERFIL DE PRODUCCIÓN (PROD)
# ===============================================
server.port=8080
spring.application.name=Inventory-Colombia
app.frontend.url=http://10.13.20.16

# ===============================================
# CONFIGURACIÓN DE LA BASE DE DATOS (Conexión local en el servidor)
# ===============================================
spring.datasource.url=jdbc:mysql://localhost:3306/asset_colombia?useSSL=false&serverTimezone=UTC
spring.datasource.username=usuario
spring.datasource.password=2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del pool de conexiones Hikari
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

# ===============================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================================
# CONFIGURACIÓN DE SEGURIDAD (JWT)
# ===============================================
jwt.secret=MiClaveSuperSecretaParaElProyectoDeInventarioDeColombiaConSeguridadReforzada2025
jwt.expiration.ms=604800000

# ===============================================
# CONFIGURACIÓN DEL SERVIDOR DE CORREO (Desde variables de entorno)
# ===============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=damian.riano@unicity.com
# ? Esta contraseña se debe configurar como variable de entorno en el servidor
spring.mail.password=${MAIL_PASSWORD}

# Propiedades adicionales para la conexión segura
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
